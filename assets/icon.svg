<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Dégradé de fond -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Dégradé du signal Wi-Fi (Cyan vers Émeraude) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dégradé du point central (Émeraude lumineux) -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ombre portée -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Arrière-plan conteneur squircle moderne -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Ondes Wi-Fi concentriques -->
  <g filter="url(#glow)">
    <!-- Onde extérieure supérieure -->
    <path d="M 44 94 A 118 118 0 0 1 212 94" fill="none" stroke="url(#waveGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Onde intermédiaire -->
    <path d="M 72 128 A 80 80 0 0 1 184 128" fill="none" stroke="url(#waveGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Onde intérieure -->
    <path d="M 98 162 A 44 44 0 0 1 158 162" fill="none" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Point central / Antenne d'émission -->
    <circle cx="128" cy="198" r="14" fill="url(#dotGrad)" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Indicateur de badge Arch / Partage (petit éclair / impulsion en haut à droite) -->
  <circle cx="196" cy="60" r="10" fill="#10b981" />
  <circle cx="196" cy="60" r="16" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6" />
</svg>
